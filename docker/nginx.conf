resolver 127.0.0.11 valid=10s;

server {
    listen 80;

    client_max_body_size 50M;
    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        # Using a variable forces nginx to re-resolve "backend" via Docker's
        # embedded DNS on every request instead of caching it once at
        # startup, so requests get spread across however many "backend"
        # replicas are currently running (docker compose up --scale backend=N).
        set $upstream http://backend:8000;
        proxy_pass $upstream;
    }
}
